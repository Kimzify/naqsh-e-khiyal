<style>
:root{
  color-scheme:dark;
  --night:#070A1F;
  --saffron:#E9B44C;
  --gold:#FFD682;
  --ivory:#F4E8D0;
  --mute:#B3AFCB;
  --wine:#9B1D3F;
  --turq:#43B7A8;
  --line:rgba(244,232,208,.32);
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ivory);overflow:hidden;font-family:"Spectral",Georgia,"Times New Roman",serif}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--night)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fa{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic","Geeza Pro","Tahoma",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--saffron);outline-offset:4px}

/* intro */
#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-inline:16px;gap:10px;transition:opacity 1s ease}
#intro.gone{opacity:0;pointer-events:none}
.eyebrow{margin:0;font-family:"Spectral SC",Georgia,serif;font-size:13px;letter-spacing:.34em;color:var(--saffron)}
#intro h1{margin:0;font-weight:400;font-size:clamp(46px,8.4vw,116px);line-height:1.95;text-shadow:0 0 50px rgba(233,180,76,.35),0 0 2px rgba(255,214,130,.4)}
.sub{margin:0 0 18px;font-style:italic;font-weight:300;font-size:clamp(16px,1.6vw,20px);color:var(--mute)}
.begin{background:var(--ivory);color:#10112a;border:0;border-radius:999px;padding:13px 40px;font-size:19px;letter-spacing:.04em;box-shadow:0 0 40px rgba(233,180,76,.35);transition:transform .3s ease,box-shadow .3s ease}
.begin:hover{transform:translateY(-2px);box-shadow:0 0 60px rgba(233,180,76,.55)}
.hint{margin:14px 0 0;font-size:13px;color:var(--mute);opacity:.8}
.textlink{background:none;border:0;padding:4px 2px;color:var(--mute);font-style:italic;font-size:15px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(179,175,203,.4)}
.textlink:hover{color:var(--ivory)}
a.textlink{display:inline-block}

/* corner mark */
#mark{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;font-family:"Spectral SC",Georgia,serif;font-size:12px;letter-spacing:.3em;color:rgba(244,232,208,.55);pointer-events:none;transition:opacity .8s}

/* caption */
#caption{position:absolute;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:2px;text-align:center;pointer-events:none}
#meta{display:flex;align-items:center;gap:12px;font-family:"Spectral SC",Georgia,serif;font-size:12px;letter-spacing:.3em;color:var(--saffron);opacity:0;transition:opacity 1s ease}
#meta .num{font-size:14px;letter-spacing:0}
#meta .dot{width:4px;height:4px;border-radius:50%;background:var(--saffron);opacity:.6}
#verse{margin:0;max-width:24em;font-size:clamp(19px,2.2vw,36px);line-height:1.95;text-wrap:balance;text-shadow:0 0 22px rgba(4,4,14,.9),0 0 30px rgba(233,180,76,.22)}
#verse .m{display:block}
#verse .m + .m{margin-top:-.15em}
#verse .w{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(.35em) scale(.96);transition:opacity 1.1s ease,filter 1.2s ease,transform 1.5s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
#gloss{margin:0;max-width:38em;font-style:italic;font-weight:300;font-size:clamp(14px,1.25vw,18px);color:var(--mute);opacity:0;transition:opacity 1.2s ease}
#caption.on #verse .w{opacity:1;filter:blur(0);transform:none}
#caption.on #meta{opacity:.9}
#caption.on #gloss{opacity:.9;transition-delay:1.1s}
#caption.out #verse .w{opacity:0;filter:blur(6px);transform:translateY(-.25em);transition-duration:.7s;transition-delay:0s}
#caption.out #meta,#caption.out #gloss{opacity:0;transition-delay:0s;transition-duration:.6s}

/* bar */
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(4,4,14,0),rgba(4,4,14,.55))}
.ctl{flex:none;height:34px;min-width:34px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:rgba(7,10,31,.35);font-family:"Spectral SC",Georgia,serif;font-size:13px;letter-spacing:.14em;transition:border-color .2s,background .2s}
.ctl:hover{border-color:var(--saffron);background:rgba(233,180,76,.1)}
.ctl.icon{padding:0;width:34px;font-size:18px;letter-spacing:0;font-family:"Spectral",Georgia,serif}
#pp{min-width:78px}
#segs{flex:1;display:flex;gap:3px;min-width:0}
.seg{flex:1;min-width:0;height:24px;border:0;padding:0;background:none;position:relative}

.seg::before,.seg i{content:"";position:absolute;left:0;right:0;top:11px;height:2px;border-radius:2px}
.seg::before{background:rgba(244,232,208,.2)}
.seg i{background:var(--saffron);transform-origin:left center;transform:scaleX(0)}
.seg:hover::before{background:rgba(244,232,208,.45)}
#clock{flex:none;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mute);min-width:3.2em;text-align:right}

/* outro */
#outro{position:absolute;inset:0;overflow-y:auto;background:rgba(5,5,16,.62);opacity:0;transition:opacity 1.4s ease}
#outro.show{opacity:1}
.outro-in{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:calc(48px + env(safe-area-inset-top,0px)) 56px;display:grid;justify-items:center;gap:18px;text-align:center}
.outro-in h2{margin:0;font-weight:400;font-size:clamp(40px,6vw,72px);line-height:1.9;color:var(--gold);text-shadow:0 0 40px rgba(233,180,76,.4)}
.poem{display:grid;gap:6px;width:100%}
.bayt{display:grid;grid-template-columns:1fr 1fr;gap:0 3em;align-items:baseline}
.bayt button{background:none;border:0;padding:0 4px;font-size:clamp(17px,1.9vw,26px);line-height:2.4;color:var(--ivory);border-radius:8px;transition:color .2s,background .2s}
.bayt button:first-child{text-align:right}
.bayt button:last-child{text-align:left}
.bayt button:hover{color:var(--gold);background:rgba(233,180,76,.07)}
.outro-note{margin:0;font-style:italic;color:var(--mute);font-size:14px}
.actions{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:8px}
@media (max-width:720px){
  .bayt{grid-template-columns:1fr;margin-bottom:10px}
  .bayt button:first-child,.bayt button:last-child{text-align:center}
  #clock{display:none}
  .ctl{padding:0 10px}
  #pp{min-width:64px}
}
@media (prefers-reduced-motion:reduce){
  #verse .w{transition-duration:.2s!important;filter:none!important}
}

<script>
(()=>{
/* ---------- the poem ---------- */
const LINES=[
 {fa:"اَلا یا اَیُّهَا السّاقی اَدِرْ کَأساً و ناوِلْها",en:"O cupbearer, bring round the cup and pass it to me,",label:"The Cup"},
 {fa:"که عشق آسان نمود اوّل ولی افتاد مشکل‌ها",en:"for love looked easy at first, and then the troubles fell.",label:"The Knot"},
 {fa:"به بویِ نافه‌ای کآخِر صبا زان طُرّه بُگشاید",en:"In hope of the musk the dawn wind will at last loosen from that lock,",label:"Dawn Wind"},
 {fa:"ز تابِ جَعدِ مشکینش چه خون افتاد در دل‌ها",en:"how much blood the twist of those dark curls has spilled into hearts.",label:"The Curls"},
 {fa:"مرا در منزلِ جانان چه امنِ عیش، چون هر دَم",en:"What ease can I have in the beloved's house, when every moment",label:"The House"},
 {fa:"جَرَس فریاد می‌دارد که بَربندید مَحمِل‌ها",en:"the caravan bell cries out: bind up the litters, we leave.",label:"The Bell"},
 {fa:"به مِی سجّاده رنگین کُن گَرَت پیرِ مُغان گوید",en:"Dye your prayer rug with wine if the Magian elder tells you to;",label:"The Prayer Rug"},
 {fa:"که سالِک بی‌خبر نَبْوَد ز راه و رسمِ منزل‌ها",en:"the wayfarer is not blind to the road and the ways of its stations.",label:"The Way"},
 {fa:"شبِ تاریک و بیمِ موج و گِردابی چنین هایل",en:"A black night, the dread of waves, a whirlpool this terrible;",label:"The Whirlpool"},
 {fa:"کجا دانند حالِ ما سبک‌بارانِ ساحل‌ها؟",en:"what do they know of us, the lightly laden on the shore?",label:"The Shore"},
 {fa:"همهْ کارم ز خودکامی به بدنامی کشید آخر",en:"Self-will has dragged all my work, in the end, to ill repute;",label:"The Name"},
 {fa:"نهان کِی مانَد آن رازی کَزو سازند مَحفل‌ها؟",en:"how could a secret stay hidden when gatherings are made of it?",label:"The Secret"},
 {fa:"حضوری گر همی خواهی از او غایب مشو حافظ",en:"If you want presence, Hafez, do not be absent from him.",label:"Presence"},
 {fa:"مَتیٰ ما تَلْقَ مَنْ تَهْویٰ دَعِ الدُّنْیا وَ اَهْمِلْها",en:"When you meet the one you love, leave the world and let it go.",label:"Letting Go"}
];
const N=LINES.length, D=9, F=1.5, TOTAL=N*D, NB=N/2, BD=2*D;
const BAYT=["The Cup and the Knot","Musk and Curls","The House and the Bell","The Rug and the Way","Storm and Shore","The Name and the Secret","Presence"];
const wordDelays=b=>{const a=LINES[2*b].fa.split(" ").length,out=[];for(let i=0;i<a;i++)out.push(i*.16);const off=a*.16+.5;LINES[2*b+1].fa.split(" ").forEach((_,j)=>out.push(off+j*.16));return out};
const faNum=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);

/* ---------- helpers ---------- */
const TAU=Math.PI*2;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const easeOut=t=>1-Math.pow(1-clamp(t),3);
const easeInOut=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${clamp(a).toFixed(3)})`;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const randArr=(seed,n,k)=>{const r=rng(seed);return Array.from({length:n},()=>Array.from({length:k},()=>r()))};

const IVORY=[244,232,208],SAFF=[233,180,76],GOLD=[255,214,130],WINE=[155,29,63],ROSE=[224,122,138],TURQ=[67,183,168],LAPIS=[24,40,110],BLOOD=[196,22,54],JADE=[150,230,220];

function bg(c,W,H,stops){const g=c.createLinearGradient(0,0,0,H);stops.forEach(([o,col])=>g.addColorStop(o,rgb(col)));c.fillStyle=g;c.fillRect(0,0,W,H)}
function glow(c,x,y,r,col,a=1){if(r<=0||a<=0)return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(.4,rgba(col,a*.35));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}
const STARS=(()=>{const r=rng(7);return Array.from({length:260},()=>({x:r(),y:r(),s:r()*1.5+.3,p:r()*TAU,f:.5+r()*2}))})();
function stars(c,W,H,t,a,ymax=1){for(const s of STARS){if(s.y>ymax)continue;const tw=.55+.45*Math.sin(t*s.f+s.p);c.fillStyle=`rgba(244,232,208,${(a*tw*(.3+s.s/1.8*.7)).toFixed(3)})`;c.fillRect(s.x*W,s.y*H,s.s,s.s)}}
function star8(c,x,y,r){c.beginPath();for(let k=0;k<=16;k++){const a=k/16*TAU-Math.PI/2,rr=k%2?r*.55:r;k?c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):c.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath()}
function archPath(c,x,y,w,h){c.moveTo(x-w/2,y);c.lineTo(x-w/2,y-h*.58);c.quadraticCurveTo(x-w/2,y-h*.92,x,y-h);c.quadraticCurveTo(x+w/2,y-h*.92,x+w/2,y-h*.58);c.lineTo(x+w/2,y);c.closePath()}
function drawDrop(c,x,y,s,fill=[200,24,56],edge=null){c.beginPath();c.moveTo(x,y-s*2.2);c.quadraticCurveTo(x+s*1.15,y-s*.2,x,y+s);c.quadraticCurveTo(x-s*1.15,y-s*.2,x,y-s*2.2);c.fillStyle=rgb(fill);c.fill();if(edge){c.strokeStyle=edge;c.lineWidth=1;c.stroke()}}
function blobPath(c,x,y,R,ph,t,sx=1){c.beginPath();for(let i=0;i<=72;i++){const a=i/72*TAU;const r=R*(1+.14*Math.sin(3*a+ph[0]*6)+.08*Math.sin(7*a+ph[1]*6+t*.4)+.05*Math.sin(13*a+ph[2]*6));const px=x+Math.cos(a)*r*sx,py=y+Math.sin(a)*r;i?c.lineTo(px,py):c.moveTo(px,py)}c.closePath()}
function girih(c,R,col,lw=1){c.strokeStyle=col;c.lineWidth=lw;c.beginPath();for(let i=0;i<=12;i++){const k=(i*5)%12,a=k/12*TAU-Math.PI/2;i?c.lineTo(Math.cos(a)*R,Math.sin(a)*R):c.moveTo(Math.cos(a)*R,Math.sin(a)*R)}c.stroke();c.beginPath();c.arc(0,0,R*1.04,0,TAU);c.stroke();c.beginPath();for(let i=0;i<=12;i++){const k=(i*5)%12,a=k/12*TAU-Math.PI/2+TAU/24;const r=R*.5;i?c.lineTo(Math.cos(a)*r,Math.sin(a)*r):c.moveTo(Math.cos(a)*r,Math.sin(a)*r)}c.stroke()}
const FA_FONT='"Noto Nastaliq Urdu","Noto Naskh Arabic","Geeza Pro",serif';

/* ---------- 1. the cup ---------- */
const MOTES1=randArr(11,44,4);
function gobletBowl(c,x,y,w){const h=w*1.1;c.beginPath();c.moveTo(x-w,y);c.bezierCurveTo(x-w,y+h*.75,x-w*.35,y+h,x,y+h);c.bezierCurveTo(x+w*.35,y+h,x+w,y+h*.75,x+w,y);c.closePath()}
function drawGoblet(c,x,y,w,level,t,alpha=1){
  const h=w*1.1;c.save();c.globalAlpha=alpha;
  if(level>0){c.save();gobletBowl(c,x,y,w);c.clip();const ly=y+h-h*level;const g=c.createLinearGradient(0,ly,0,y+h);g.addColorStop(0,"rgb(222,62,96)");g.addColorStop(1,"rgb(86,6,28)");c.fillStyle=g;c.beginPath();c.moveTo(x-w-2,y+h+2);for(let i=0;i<=20;i++){c.lineTo(x-w+i/20*2*w,ly+Math.sin(i*.9+t*3)*w*.035)}c.lineTo(x+w+2,y+h+2);c.closePath();c.fill();c.restore()}
  gobletBowl(c,x,y,w);c.fillStyle="rgba(244,232,208,.05)";c.fill();c.strokeStyle=rgb(GOLD);c.lineWidth=Math.max(1,w*.035);c.stroke();
  c.beginPath();c.ellipse(x,y,w,w*.12,0,0,TAU);c.stroke();
  c.beginPath();c.moveTo(x,y+h);c.lineTo(x,y+h*1.6);c.stroke();
  c.beginPath();c.ellipse(x,y+h*1.62,w*.5,w*.1,0,0,TAU);c.stroke();
  c.beginPath();c.arc(x,y+h*1.25,w*.07,0,TAU);c.fillStyle=rgb(GOLD);c.fill();
  c.restore();
}
function sCup(c,t,W,H){
  const S=Math.min(W,H),cx=W/2,cy=H*.4;
  bg(c,W,H,[[0,[14,10,38]],[.6,[34,10,40]],[1,[20,6,22]]]);
  stars(c,W,H,t,.5);
  glow(c,cx,cy,S*.6,WINE,.35+.1*Math.sin(t*1.3));
  const R=Math.min(S*.4,W*.44),ry=S*.085,oy=cy+S*.17,n=7,spin=t*.4;
  c.strokeStyle=rgba(SAFF,.16);c.lineWidth=1;c.beginPath();c.ellipse(cx,oy,R,ry,0,0,TAU);c.stroke();
  const cups=[];for(let i=0;i<n;i++){const a=i/n*TAU+spin;cups.push({x:cx+Math.cos(a)*R,y:oy+Math.sin(a)*ry,z:Math.sin(a)})}
  const pa=t*1.1,px=cx+Math.cos(pa)*R,py=oy+Math.sin(pa)*ry,pz=Math.sin(pa);

/* ---------- 2. the knot ---------- */

 [[1.5,"D4",3.2],[5,"F4",2.2],[7.4,"Ek4",1.6],[9.1,"D4",2.9],[12.3,"G4",2],[14.5,"F4",1.3],[15.9,"Ek4",1.8]],        // the cup, then the troubles
 [[1.6,"A4",3.2],[5,"G4",1.6],[6.8,"A4",2.4],[9.6,"C5",2],[11.8,"Bb4",1.6],[13.6,"A4",1.5],[15.2,"G4",2.3]],       // musk on the wind, blood in hearts
 [[1.8,"F4",2.5],[4.5,"Ek4",3],[8,"D4",2],[10.4,"A4",2.8],[13.4,"G4",1.5],[15.1,"F4",2.4]],                      // no rest in the house, the bell calls
 [[1.6,"D4",2],[3.8,"Ek4",1.6],[5.6,"F4",2.4],[8.2,"G4",1.8],[10.2,"A4",2.4],[12.8,"Bb4",1.6],[14.6,"A4",2.8]],     // the road climbs, station by station
 [[1.5,"A3",3.5],[5.2,"Bb3",2],[7.4,"A3",2.6],[10.6,"D5",4],[14.8,"C5",2.6]],                                    // dark water, then the far calm shore
 [[1.6,"C5",2],[3.8,"Bb4",1.6],[5.6,"A4",1.6],[7.4,"G4",1.4],[9,"F4",1.2],[10.4,"Ek4",2.4],[13.2,"F4",1.6],[15,"D4",2.6]], // the fall into ill repute
 [[2,"D4",4],[6.4,"F4",2.4],[9.2,"A4",3],[12.6,"D5",4.8]]                                                        // presence, and letting go
];
const PADS=[[["D3","A3"],["G2","D3"]],[["D3","A3"],["F2","C3"]],[["D3","A3"],["C3","G3"]],[["D3","A3"],["Bb2","F3"]],[["Bb2","F3"],["D3","A3"]],[["G2","D3"],["D3","A3"]],[["D3","A3"],["D3","A3","D4"]]];
for(let b=0;b<NB;b++){
  NEY[b].forEach(([t,n,d])=>EVENTS.push({t:b*BD+t,fn:()=>ney(NT[n],d)}));
  PADS[b].forEach((ch,h)=>EVENTS.push({t:b*BD+.2+h*9,fn:()=>pad(ch.map(n=>NT[n]),9.4)}));
  const m2=wordDelays(b)[LINES[2*b].fa.split(" ").length];
  EVENTS.push({t:b*BD+.8,fn:()=>strike(NT.D3,.12)});
  EVENTS.push({t:b*BD+.7+m2,fn:()=>strike(NT[PADS[b][1][0]]*2,.1)});
}
// a few quiet touches that follow the pictures
for(let k=0;k<8;k++){const tk=(Math.PI/2+k*Math.PI)/2.2;if(tk<D&&k%2===0)EVENTS.push({t:5*D+tk,fn:bell})}
LT.forEach(l=>EVENTS.push({t:8*D+l,fn:()=>thunder(l>6.5?.4:.8)}));
EVENTS.push({t:6*D+3.6,fn:()=>strike(NT.A4,.09)});
[0,1,2,3,4].forEach(i=>EVENTS.push({t:11*D+3.6+i*.9,fn:()=>strike([NT.D5,NT.A4,NT.C5,NT.G4,NT.A4][i],.06)}));
EVENTS.push({t:13*D+5,fn:()=>[NT.D3,NT.A3,NT.D4,NT.F4,NT.A4].forEach((f,i)=>strike(f,.09,i*.35))});
function fire(a,b){for(const e of EVENTS)if(e.t>a&&e.t<=b)try{e.fn()}catch(_){}}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
// anonymous, cookie-free stats (Umami): how far people get into the poem
const track=e=>{try{window.umami&&umami.track(e,{poem:"ghazal-1"})}catch(_){}};const seen=new Set();let finished=false;
const intro=$("intro"),cap=$("caption"),bar=$("bar"),outro=$("outro"),mark=$("mark");
const verse=$("verse"),gloss=$("gloss"),label=$("label"),segs=$("segs"),pp=$("pp"),snd=$("snd"),clockEl=$("clock"),markLabel=$("markLabel");
const segEls=BAYT.map((T,i)=>{const b=document.createElement("button");b.className="seg";b.setAttribute("aria-label",`Couplet ${i+1}: ${T}`);b.innerHTML="<i></i>";b.addEventListener("click",()=>jump(i));segs.appendChild(b);return b.firstChild});
const poem=$("poem");
for(let b=0;b<N/2;b++){const row=document.createElement("div");row.className="bayt";[2*b,2*b+1].forEach(i=>{const bt=document.createElement("button");bt.textContent=LINES[i].fa;bt.title=LINES[i].en;bt.addEventListener("click",()=>jump(b));row.appendChild(bt)});poem.appendChild(row)}

let mode="intro",playing=false,time=0,clock=0,outroStart=0,last=performance.now();
let capS=-1,capState="";
function build(b){verse.textContent="";const dl=wordDelays(b);let n=0;[2*b,2*b+1].forEach(li=>{const m=document.createElement("span");m.className="m";const ws=LINES[li].fa.split(" ");ws.forEach((w,i)=>{const sp=document.createElement("span");sp.className="w";sp.textContent=w;sp.style.setProperty("--d",dl[n++].toFixed(2)+"s");m.appendChild(sp);if(i<ws.length-1)m.appendChild(document.createTextNode(" "))});verse.appendChild(m)});
  gloss.textContent=LINES[2*b].en+" "+LINES[2*b+1].en;label.textContent=BAYT[b];markLabel.textContent=`${b+1} / ${NB}`;cap.classList.remove("on","out")}
function updateCaption(s,t){if(t>3&&!seen.has(s)){seen.add(s);track("couplet-"+(s+1))}if(s!==capS){capS=s;build(s);capState=""}const st=t<.7?"pre":t<BD-.8?"on":"out";if(st!==capState){capState=st;cap.classList.toggle("on",st==="on");cap.classList.toggle("out",st==="out")}}
function fmt(x){x=Math.max(0,Math.floor(x));return`${Math.floor(x/60)}:${String(x%60).padStart(2,"0")}`}
function updateBar(){segEls.forEach((el,i)=>{el.style.transform=`scaleX(${clamp((time-i*BD)/BD).toFixed(4)})`});clockEl.textContent=fmt(time)}
function setPlaying(p){playing=p;pp.textContent=p?"Pause":"Play";if(AC){try{p?AC.resume():AC.suspend()}catch(_){}}}

// the scene gets the top of the screen; the caption sits on its own band below it
let CAPH=0;const sceneH=()=>H-clamp(CAPH+76+34,H*.24,H*.56);
function measureCaps(){if(cap.hidden)return;let m=0;for(let b=0;b<NB;b++){build(b);m=Math.max(m,cap.offsetHeight)}CAPH=m;capS=-1;capState=""}
addEventListener("resize",()=>{if(mode==="play")measureCaps()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(mode==="play")measureCaps()}).catch(()=>{});
function sceneFrame(c,Hs){const g=c.createRadialGradient(W/2,Hs*.45,Math.min(W,Hs)*.3,W/2,Hs*.5,Math.max(W,Hs)*.78);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(2,3,8,.5)");c.fillStyle=g;c.fillRect(0,0,W,Hs);
  const f=c.createLinearGradient(0,Hs-40,0,Hs);f.addColorStop(0,"rgba(7,10,31,0)");f.addColorStop(1,"rgba(7,10,31,1)");c.fillStyle=f;c.fillRect(0,Hs-40,W,40);c.fillStyle="rgb(7,10,31)";c.fillRect(0,Hs,W,H-Hs);c.fillStyle="rgba(230,190,99,.4)";c.fillRect(W/2-36,Hs+8,72,1)}
function start(at=0){initAudio();mode="play";time=at;capS=-1;intro.classList.add("gone");setTimeout(()=>{if(mode!=="intro")intro.hidden=true},1000);outro.classList.remove("show");outro.hidden=true;cap.hidden=false;bar.hidden=false;mark.hidden=false;measureCaps();setPlaying(true)}
function toOutro(){if(mode==="play"&&!finished){finished=true;track("finish")}mode="outro";outroStart=clock;setPlaying(false);if(AC)try{AC.resume()}catch(_){}cap.hidden=true;bar.hidden=true;mark.hidden=true;intro.hidden=true;outro.hidden=false;requestAnimationFrame(()=>outro.classList.add("show"))}
function jump(i){if(mode!=="play"){start(i*BD);return}time=i*BD;capS=-1;if(!playing)setPlaying(true)}
$("begin").addEventListener("click",()=>{track("begin");start(0)});
$("again").addEventListener("click",()=>start(0));
$("readBtn").addEventListener("click",()=>{track("read-text");intro.classList.add("gone");setTimeout(()=>{intro.hidden=true},900);toOutro()});
pp.addEventListener("click",()=>setPlaying(!playing));
$("prev").addEventListener("click",()=>{const s=Math.floor(time/BD);jump(time-s*BD>2?s:Math.max(0,s-1))});
$("next").addEventListener("click",()=>{const s=Math.floor(time/BD);if(s+1<NB)jump(s+1);else toOutro()});
snd.addEventListener("click",()=>{soundOn=!soundOn;if(!soundOn)track("sound-off");snd.textContent=soundOn?"Sound on":"Sound off";if(master)master.gain.setTargetAtTime(soundOn?1:0,AC.currentTime,.1)});
addEventListener("keydown",e=>{if(mode!=="play")return;if(e.code==="Space"){e.preventDefault();setPlaying(!playing)}else if(e.key==="ArrowRight")$("next").click();else if(e.key==="ArrowLeft")$("prev").click()});

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  if(mode==="play"&&playing){const p=time;time+=dt;fire(p,time);if(time>=TOTAL){time=TOTAL;toOutro()}}
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(mode==="intro"){sAmbient(ctx,clock,W,H)}
  else if(mode==="outro"){ctx.save();sRelease(ctx,D+(clock-outroStart)*.4+.01,W,H);ctx.restore();ctx.fillStyle="rgba(4,4,14,.35)";ctx.fillRect(0,0,W,H)}
  else{const s=Math.min(N-1,Math.floor(time/D)),t=time-s*D,Hs=sceneH(),Hv=Hs/.7;
    ctx.save();ctx.beginPath();ctx.rect(0,0,W,Hs);ctx.clip();SCENES[s](ctx,t,W,Hv);ctx.restore();
    const Fs=s%2?2.6:F;if(s>0&&t<Fs){octx.setTransform(1,0,0,1,0,0);octx.clearRect(0,0,off.width,off.height);octx.setTransform(dpr,0,0,dpr,0,0);octx.save();octx.beginPath();octx.rect(0,0,W,Hs);octx.clip();SCENES[s-1](octx,t+D,W,Hv);octx.restore();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1-ss(0,Fs,t);ctx.drawImage(off,0,0);ctx.restore()}
    ctx.setTransform(dpr,0,0,dpr,0,0);sceneFrame(ctx,Hs);updateCaption(Math.floor(s/2),time-Math.floor(s/2)*BD);updateBar()}
  if(mode!=="play")vignette(ctx);
  requestAnimationFrame(frame);
}
if(document.fonts&&document.fonts.load){document.fonts.load(`80px "Noto Nastaliq Urdu"`,"نام حافظ").catch(()=>{})}
window.__seek=x=>{if(mode!=="play")start(x);time=x;capS=-1;setPlaying(false)};
requestAnimationFrame(frame);
})();
</script>
</body>
